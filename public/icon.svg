<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d07"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#glowGrad)" stroke-width="12" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Inner Card -->
  <rect x="56" y="56" width="400" height="400" rx="88" fill="#120e0b" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1"/>

  <!-- Monogram AJ -->
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="190" font-weight="900" fill="url(#glowGrad)" text-anchor="middle" letter-spacing="-6" filter="url(#glow)">AJ</text>
  
  <!-- Subtitle Tag -->
  <text x="256" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="8" opacity="0.9">CREATOR BIO</text>
</svg>
